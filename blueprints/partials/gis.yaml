form:
  fields:
    header.markers:
      # Drawn in Admin2 by admin-next/fields/gis-markers.js: a map holding
      # every marker of the page above the list of their names, icons and
      # coordinates
      type: gis-markers
      label: PLUGIN_GIS.MARKERS
      validate:
        # Grav filters a field type it doesn't know as text, which would
        # turn the markers into an empty string on save
        type: list
